<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudForge — Contact Us</title>
  <script>
    (function () {
      try {
        if (localStorage.getItem("cf-theme") === "light") {
          document.documentElement.classList.add("light");
        }
      } catch (e) {}
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            page: 'rgb(var(--c-page) / <alpha-value>)',
            'page-soft': 'rgb(var(--c-page-soft) / <alpha-value>)',
            panel: 'rgb(var(--c-panel) / <alpha-value>)',
            surface: 'rgb(var(--c-surface) / <alpha-value>)',
            border: 'rgb(var(--c-border) / <alpha-value>)',
            muted: 'rgb(var(--c-muted) / <alpha-value>)',
            soft: 'rgb(var(--c-soft) / <alpha-value>)',
            brand: {
              DEFAULT: 'rgb(var(--c-brand) / <alpha-value>)',
              dark: 'rgb(var(--c-brand-dark) / <alpha-value>)'
            },
            cyan: 'rgb(var(--c-cyan) / <alpha-value>)',
            success: 'rgb(var(--c-success) / <alpha-value>)',
            warning: 'rgb(var(--c-warning) / <alpha-value>)',
            danger: 'rgb(var(--c-danger) / <alpha-value>)',
            white: 'rgb(var(--c-white) / <alpha-value>)',
            slate: {
              500: 'rgb(var(--c-slate-500) / <alpha-value>)',
              600: 'rgb(var(--c-slate-600) / <alpha-value>)',
              700: 'rgb(var(--c-slate-700) / <alpha-value>)',
              800: 'rgb(var(--c-slate-800) / <alpha-value>)',
              900: 'rgb(var(--c-slate-900) / <alpha-value>)'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./src/input.css">
  <style>
    .theme-icon-sun { display: none; }
    .theme-icon-moon { display: block; }
    html.light .theme-icon-sun { display: block; }
    html.light .theme-icon-moon { display: none; }
    html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after {
      transition: background-color .35s ease, border-color .35s ease, color .35s ease, fill .35s ease, box-shadow .35s ease !important;
    }
    
    /* Error state styles as required by assignment */
    .field-input[aria-invalid="true"] {
      border-color: rgb(var(--c-danger));
      box-shadow: 0 0 0 1px rgba(var(--c-danger), 0.2);
    }
    .field-input:focus-visible {
      outline: 2px solid rgb(var(--c-brand-dark));
      outline-offset: 2px;
    }
    
    /* Toast styles */
    #toast-container {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      pointer-events: none;
    }
    .toast {
      background: rgb(var(--c-surface));
      border: 1px solid rgb(var(--c-border));
      padding: 1rem 1.5rem;
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      transform: translateY(100%);
      opacity: 0;
      transition: all 0.3s ease;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body class="bg-page text-white">
  
  <header class="sticky top-0 z-50 border-b border-slate-800/80 bg-page/95 backdrop-blur">
    <nav class="mx-auto flex h-[64px] max-w-[1280px] items-center justify-between px-5 lg:px-8">
      <a data-page-link href="index.html#hero" class="flex items-center gap-2.5 font-bold">
        <span class="grid h-7 w-7 place-items-center rounded-md border border-brand/70 bg-brand/10 text-cyan">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span>CloudForge</span>
      </a>

      <div id="desktop-nav" class="hidden items-center gap-8 text-xs text-soft md:flex">
        <a class="transition hover:text-white" href="index.html#hero">Product</a>
        <a class="transition hover:text-white" href="index.html#features">Features</a>
        <a class="transition hover:text-white" href="index.html#pricing">Pricing</a>
        <a class="transition hover:text-white" href="index.html#faq">Docs</a>
        <a class="transition hover:text-white" href="index.html#Enterprise">Enterprise</a>
        <a class="transition hover:text-white" href="records.html">Data Records</a>
        <a class="text-cyan" href="contact.html">Contact</a>
      </div>

      <div class="hidden items-center gap-5 md:flex">
        <button data-theme-toggle type="button" class="grid h-8 w-8 place-items-center rounded-lg border border-slate-700 text-soft transition hover:border-slate-500 hover:text-white" aria-label="Switch to light mode" aria-pressed="false" title="Toggle theme">
          <svg class="theme-icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <a href="#" class="text-xs text-soft hover:text-white">Sign in</a>
        <a data-page-link href="index.html#pricing" class="rounded-full bg-brand-dark px-5 py-2 text-xs font-semibold shadow-glow transition hover:bg-brand">Start Free Trial</a>
      </div>

      <div class="flex items-center gap-2 md:hidden">
        <button data-theme-toggle type="button" class="grid h-9 w-9 place-items-center rounded-lg border border-slate-700 text-soft transition hover:border-slate-500 hover:text-white" aria-label="Switch to light mode" aria-pressed="false" title="Toggle theme">
          <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="menu-button" class="rounded-lg border border-slate-700 p-2 text-soft md:hidden" aria-label="Open menu" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </nav>

    <div id="mobile-menu" class="hidden border-t border-slate-800 bg-page px-5 py-5 md:hidden">
      <div class="flex flex-col gap-4 text-sm text-soft">
        <a data-page-link href="index.html#hero">Product</a><a data-page-link href="index.html#features">Features</a><a data-page-link href="index.html#pricing">Pricing</a><a data-page-link href="index.html#faq">Docs</a><a data-page-link href="index.html#pricing">Enterprise</a>
        <a href="records.html">Data Records</a><a href="contact.html">Contact</a>
        <a data-page-link href="index.html#pricing" class="mt-2 rounded-full bg-brand-dark px-5 py-3 text-center font-semibold text-white">Start Free Trial</a>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-[600px] px-5 py-12 lg:px-8">
    <div class="mb-10 text-center">
      <h1 class="text-3xl font-bold">Contact Support</h1>
      <p class="mt-3 text-sm text-soft">Reach out to our engineering team for specialized assistance.</p>
    </div>

    <form id="contact-form" class="rounded-xl border border-slate-800 bg-surface p-6 sm:p-8 shadow-card">
      
      <div class="mb-6">
        <label for="name" class="block text-xs font-semibold text-soft mb-2">Họ và tên</label>
        <input type="text" id="name" name="name" required class="field-input w-full rounded-lg border border-slate-700 bg-page px-4 py-2.5 text-sm text-white placeholder-slate-600 focus:border-cyan focus:outline-none" placeholder="Nguyễn Văn A">
        <div class="error-msg mt-1.5 text-xs text-danger hidden font-medium"></div>
      </div>

      <div class="mb-6">
        <label for="email" class="block text-xs font-semibold text-soft mb-2">Email</label>
        <input type="email" id="email" name="email" required class="field-input w-full rounded-lg border border-slate-700 bg-page px-4 py-2.5 text-sm text-white placeholder-slate-600 focus:border-cyan focus:outline-none" placeholder="name@company.com">
        <div class="error-msg mt-1.5 text-xs text-danger hidden font-medium"></div>
      </div>
      
      <div class="mb-6">
        <label for="phone" class="block text-xs font-semibold text-soft mb-2">Số điện thoại</label>
        <input type="text" id="phone" name="phone" required pattern="^0\d{9}$" class="field-input w-full rounded-lg border border-slate-700 bg-page px-4 py-2.5 text-sm text-white placeholder-slate-600 focus:border-cyan focus:outline-none" placeholder="0912345678">
        <div class="error-msg mt-1.5 text-xs text-danger hidden font-medium"></div>
      </div>

      <div class="mb-8">
        <label for="message" class="block text-xs font-semibold text-soft mb-2">Nội dung liên hệ</label>
        <textarea id="message" name="message" required minlength="10" rows="4" class="field-input w-full rounded-lg border border-slate-700 bg-page px-4 py-2.5 text-sm text-white placeholder-slate-600 focus:border-cyan focus:outline-none" placeholder="Mô tả vấn đề của bạn..."></textarea>
        <div class="error-msg mt-1.5 text-xs text-danger hidden font-medium"></div>
      </div>

      <button type="submit" class="w-full rounded-lg bg-brand-dark py-3 text-sm font-bold text-white shadow-glow transition hover:bg-brand">
        Gửi liên hệ
      </button>
    </form>
  </main>

  <footer class="border-t border-slate-800 bg-page mt-12">
    <div class="mx-auto max-w-[1120px] px-5 py-8 lg:px-8 text-center text-xs text-soft">
      © 2026 CloudForge Inc. All rights reserved.
    </div>
  </footer>
  
  <div id="toast-container"></div>

  <script src="./src/contact.js"></script>
</body>
</html>
